name: diary_app
description: A simple Flutter diary using Hive for local storage.
publish_to: "none"
version: 1.0.0+1

environment:
   sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.11
  flutter_local_notifications: ^12.0.4
  timezone: ^0.9.0
  intl: ^0.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
